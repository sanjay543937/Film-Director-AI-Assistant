[project]
name = "film-director-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
film-director-ai = "film_director_ai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
